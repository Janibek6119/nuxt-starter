  - sass-embedded-android-arm@1.107.0
  - sass-embedded-android-riscv64@1.107.0
  - sass-embedded-android-x64@1.107.0
  - sass-embedded-darwin-arm64@1.107.0
  - sass-embedded-darwin-x64@1.107.0
  - sass-embedded-linux-arm64@1.107.0
  - sass-embedded-linux-arm@1.107.0
  - sass-embedded-linux-musl-arm64@1.107.0
  - sass-embedded-linux-musl-arm@1.107.0
  - sass-embedded-linux-musl-riscv64@1.107.0
  - sass-embedded-linux-musl-x64@1.107.0
  - sass-embedded-linux-riscv64@1.107.0
  - sass-embedded-linux-x64@1.107.0
  - sass-embedded-unknown-all@1.107.0
  - sass-embedded-win32-arm64@1.107.0
