publicHoistPattern:
  - "@primevue/core"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  unrs-resolver: true

catalog:
  "@types/node": "24" # to avoid updating it in package.json when updating pkgs
  "typescript": "6"

patchedDependencies:
  '@primevue/nuxt-module': patches/@primevue__nuxt-module.patch
  vue-i18n: patches/vue-i18n.patch
